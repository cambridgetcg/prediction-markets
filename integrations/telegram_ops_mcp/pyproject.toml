[project]
name = "kingdom-telegram-ops-mcp"
version = "0.1.0"
description = "Isolated dependencies for the local Telegram Ops MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "anyio>=4.10,<5",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
